version: '3.9'

services:
  nginx:
    image: nginx:1-alpine
    ports:
      - "443:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    networks:
      - app-network
    depends_on:
      - backend
      - frontend
      - broker

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_PASSWORD=$DB_PASS
      - POSTGRES_USER=$DB_USER
      - POSTGRES_DB=$DB_NAME
      - PGUSER=$DB_USER
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs/postgres:/var/lib/postgresql/certs:ro
    command: |
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
      -c ssl_key_file=/var/lib/postgresql/certs/server.key
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
      - ./conf/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./certs/redis:/etc/redis/certs:ro
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass $REDIS_PASSWORD
    networks:
      - cache-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: ghcr.io/petersaletra/kittyplant-backend:latest
    ports:
      - 8000:$APP_PORT
    environment:
      - PORT=$APP_PORT
      - JWT_SECRET=$JWT_SECRET
      - DB_HOST=$DB_HOST
      - DB_PORT=$DB_PORT
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_PASS=$DB_PASS
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
      - REDIS_PASSWORD=$REDIS_PASSWORD
      - BROKER=$BROKER
      - BROKER_USER=$BROKER_USER
      - BROKER_PASSWORD=$BROKER_PASSWORD
    volumes:
      - ./backend:/app
    networks:
      - app-network
      - db-network
      - cache-network
    restart: on-failure
    depends_on:
      postgres:
          condition: service_healthy
      redis:
          condition: service_healthy
      broker:
          condition: service_started

  frontend:
    image: ghcr.io/petersaletra/kittyplant-frontend:latest
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend

  broker:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
    volumes:
      - ./conf/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./conf/mosquitto/certs:/mosquitto/certs:ro
      - ./conf/mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true
  cache-network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
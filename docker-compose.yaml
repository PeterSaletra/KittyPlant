x-generated-tls: &generated-tls
  type: bind
  read_only: true
  bind:
    create_host_path: false

services:
  nginx:
    image: nginx:1-alpine
    ports:
      - "443:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - <<: *generated-tls
        source: ./.data/tls/web
        target: /etc/nginx/certs
    networks:
      - app-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: "${DB_PASS:?Run bash setup.sh first}"
      POSTGRES_USER: "${DB_USER:-kittyplant}"
      POSTGRES_DB: "${DB_NAME:-kittyplant}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - <<: *generated-tls
        source: ./.data/tls/postgres
        target: /var/lib/postgresql/certs
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/certs/server.key
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8
    volumes:
      - redis_data:/data
      - ./conf/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - <<: *generated-tls
        source: ./.data/tls/redis
        target: /etc/redis/certs
      - <<: *generated-tls
        source: ./.data/tls/redis-client
        target: /etc/redis/client
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?Run bash setup.sh first}"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?Run bash setup.sh first}"
    networks:
      - cache-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /etc/redis/client/ca.crt --cert /etc/redis/client/client.crt --key /etc/redis/client/client.key ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./kittyplant-api
    environment:
      PORT: "8000"
      JWT_SECRET: "${JWT_SECRET:?Run bash setup.sh first}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-kittyplant}"
      DB_USER: "${DB_USER:-kittyplant}"
      DB_PASS: "${DB_PASS:?Run bash setup.sh first}"
      DB_TLS_CA: /run/kittyplant/postgres-ca.crt
      REDIS_HOST: redis:6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Run bash setup.sh first}"
      REDIS_TLS_DIR: /run/kittyplant/redis
      BROKER: ssl://broker:8883
    volumes:
      - <<: *generated-tls
        source: ./.data/tls/db-ca.crt
        target: /run/kittyplant/postgres-ca.crt
      - <<: *generated-tls
        source: ./.data/tls/redis-client
        target: /run/kittyplant/redis
      - <<: *generated-tls
        source: ./.data/tls/mqtt-client
        target: /go/src/api/conf/mosquitto/certs
    networks:
      - app-network
      - db-network
      - cache-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./kittyplant-app
    networks:
      - app-network
    restart: unless-stopped

  broker:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
    volumes:
      - ./conf/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./conf/mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - <<: *generated-tls
        source: ./.data/tls/mqtt
        target: /mosquitto/certs
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true
  cache-network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
